<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 72" width="64" height="72" role="img" aria-label="EAIP-365">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#8a4bd0"/><stop offset="0.55" stop-color="#5a2a98"/><stop offset="1" stop-color="#2f1260"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6df0ff"/><stop offset="1" stop-color="#1f8fe6"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b9cf0"/><stop offset="1" stop-color="#0a5cb0"/>
    </linearGradient>
  </defs>
  <!-- crest -->
  <path d="M32 2 L58 10 V34 C58 52 46 64 32 70 C18 64 6 52 6 34 V10 Z" fill="url(#shield)" stroke="#c9a8f2" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M32 6 L54 12.6 V34 C54 49.5 44 60 32 65.6 C20 60 10 49.5 10 34 V12.6 Z" fill="none" stroke="#e3d1fa" stroke-opacity=".55" stroke-width=".7"/>
  <!-- technical markings: top ticks -->
  <g stroke="#e3d1fa" stroke-opacity=".8" stroke-width=".8" stroke-linecap="round">
    <path d="M20 9.6v2M23.5 10.6v3M27 11.4v2M32 11.8v3.4M37 11.4v2M40.5 10.6v3M44 9.6v2"/>
  </g>
  <!-- circuit traces on each flank, ending in nodes -->
  <g fill="none" stroke="#e3d1fa" stroke-opacity=".85" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 20 H16 V27 H12.5 V36 H15.5 V43"/>
    <path d="M51 20 H48 V27 H51.5 V36 H48.5 V43"/>
  </g>
  <g fill="#6df0ff">
    <circle cx="13" cy="20" r="1.3"/><circle cx="12.5" cy="31" r="1.1"/><circle cx="15.5" cy="43" r="1.3"/>
    <circle cx="51" cy="20" r="1.3"/><circle cx="51.5" cy="31" r="1.1"/><circle cx="48.5" cy="43" r="1.3"/>
  </g>
  <!-- azure-style "A" fused into the crest -->
  <path d="M31 16 L15 53 H26 L37 29 Z" fill="url(#blade)"/>
  <path d="M38.5 31.5 L51 53 H27.5 L32 43 H41 Z" fill="url(#foot)"/>
  <path d="M31 16 L37 29 L26 53" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width=".6"/>
  <!-- helix of traces at the point of the crest -->
  <g fill="none" stroke="#e3d1fa" stroke-linecap="round" stroke-width=".9">
    <path d="M24 59.5 q2 -3 4 0 t4 0 t4 0 t4 0" stroke-opacity=".95"/>
    <path d="M24 59.5 q2 3 4 0 t4 0 t4 0 t4 0" stroke-opacity=".55"/>
  </g>
  <g stroke="#6df0ff" stroke-width=".6" stroke-opacity=".9"><path d="M26 57.6v3.8M30 57.6v3.8M34 57.6v3.8M38 57.6v3.8"/></g>
</svg>
